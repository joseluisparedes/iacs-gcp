# Ruff Configuration for IACS Enterprise Backend
target-version = "py313"
line-length = 120

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long
    "E712",  # comparison to True/False in SQLAlchemy queries
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
    "W191",  # indentation contains tabs
    "B904",  # raise ... from err
]
